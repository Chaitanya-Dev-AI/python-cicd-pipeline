name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # STAGE 1: CONTINUOUS INTEGRATION & COVERAGE
  # ==========================================
  ci-quality-and-tests:
    name: 1. Lint, Test & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff static analysis
        run: ruff check .

      - name: Run Pytest with 85% coverage gate
        run: pytest -v --cov=app --cov-fail-under=85

  # ==========================================
  # STAGE 2: BUILD, SECURITY SCAN & PUSH ARTIFACT
  # ==========================================
  cd-build-scan-push:
    name: 2. Docker Build, Trivy Scan & Push
    needs: ci-quality-and-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for security scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-api:${{ github.sha }}

      - name: Scan Docker image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/inventory-api:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push verified image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/inventory-api:latest
            ${{ secrets.DOCKER_USERNAME }}/inventory-api:${{ github.sha }}

  # ==========================================
  # STAGE 3: DEPLOY & VERIFY PRODUCTION READINESS
  # ==========================================
  cd-deploy-and-verify:
    name: 3. Deploy & Verify Readiness Probe
    needs: cd-build-scan-push
    runs-on: ubuntu-latest

    steps:
      - name: Pull verified image & verify /health and /ready probes
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/inventory-api:${{ github.sha }}
          docker run -d --name prod-inventory -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/inventory-api:${{ github.sha }}
          sleep 4
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/ready
          docker stop prod-inventory

      - name: Trigger Live Cloud Deployment (Render)
        if: ${{ env.HAS_RENDER_HOOK == 'true' }}
        env:
          HAS_RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Live cloud deployment triggered!"