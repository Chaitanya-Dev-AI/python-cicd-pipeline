name: Python CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # STAGE 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci-quality-and-tests:
    name: 1. Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Pytest suite
        run: pytest -v

  # ==========================================
  # STAGE 2: CONTINUOUS DELIVERY - ARTIFACT BUILD
  # ==========================================
  cd-build-and-push:
    name: 2. Build & Push Docker Artifact
    needs: ci-quality-and-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/inventory-api:latest
            ${{ secrets.DOCKER_USERNAME }}/inventory-api:${{ github.sha }}

  # ==========================================
  # STAGE 3: CONTINUOUS DEPLOYMENT & SMOKE TEST
  # ==========================================
  cd-deploy-and-verify:
    name: 3. Deploy & Smoke Test Container
    needs: cd-build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Pull published image from Docker Hub
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/inventory-api:${{ github.sha }}

      - name: Start production container & run health check
        run: |
          docker run -d --name prod-inventory -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/inventory-api:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8000/health
          docker stop prod-inventory